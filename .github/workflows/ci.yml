name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - run: uv sync --group dev --frozen
      - name: Unit tests
        run: uv run pytest -q -m "not harness" --tb=short
      - name: Harness
        run: uv run pytest -q -m harness --tb=short
      - name: Coverage (harness core)
        run: >
          uv run pytest -q --tb=short
          --cov=agentgw.harness --cov=agentgw.agent
          --cov=agentgw.skills --cov=agentgw.tools
          --cov-report=term-missing --cov-fail-under=80
