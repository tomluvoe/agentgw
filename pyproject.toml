[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgw"
version = "0.2.0"
description = "Agent harness: loop, SKILL.md loading, and tool management"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.18",
    "click>=8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
discord = [
    "discord.py>=2.4",
]
telegram = [
    "python-telegram-bot>=21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
agentgw = "agentgw.channels.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
